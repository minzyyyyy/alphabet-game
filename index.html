<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알파벳-한글 양방향 학습 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; font-family: 'Malgun Gothic', sans-serif; touch-action: none; }
        canvas { display: block; background: #ffffff; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        #input-box { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        input { font-size: 30px; width: 220px; text-align: center; border: 3px solid #db2777; border-radius: 15px; outline: none; padding: 10px; color: #db2777; font-weight: bold; }
        #guide-text { margin-bottom: 10px; color: #db2777; font-weight: bold; font-size: 18px; background: white; padding: 8px 20px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 2px solid #fbcfe8; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="input-box">
        <div id="guide-text">게임을 시작합니다!</div>
        <input type="text" id="answerInput" autofocus autocomplete="off" placeholder="정답 입력 후 엔터">
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const input = document.getElementById("answerInput");
    const guide = document.getElementById("guide-text");

    canvas.width = 800;
    canvas.height = 600;

    let score = 0, lives = 5, level = 1;
    let fallingChars = [];
    let gameActive = true;

    const charDb = [
        {upper: "A", lower: "a", kor: "에이"}, {upper: "B", lower: "b", kor: "비"},
        {upper: "C", lower: "c", kor: "씨"}, {upper: "D", lower: "d", kor: "디"},
        {upper: "E", lower: "e", kor: "이"}, {upper: "F", lower: "f", kor: "에프"},
        {upper: "G", lower: "g", kor: "쥐"}, {upper: "H", lower: "h", kor: "에이치"},
        {upper: "I", lower: "i", kor: "아이"}, {upper: "J", lower: "j", kor: "제이"},
        {upper: "K", lower: "k", kor: "케이"}, {upper: "L", lower: "l", kor: "엘"},
        {upper: "M", lower: "m", kor: "엠"}, {upper: "N", lower: "n", kor: "엔"},
        {upper: "O", lower: "o", kor: "오"}, {upper: "P", lower: "p", kor: "피"},
        {upper: "Q", lower: "q", kor: "큐"}, {upper: "R", lower: "r", kor: "알"},
        {upper: "S", lower: "s", kor: "에스"}, {upper: "T", lower: "t", kor: "티"},
        {upper: "U", lower: "u", kor: "유"}, {upper: "V", lower: "v", kor: "브이"},
        {upper: "W", lower: "w", kor: "더블유"}, {upper: "X", lower: "x", kor: "엑스"},
        {upper: "Y", lower: "y", kor: "와이"}, {upper: "Z", lower: "지"}
    ];

    function updateGuide() {
        const texts = {
            1: "1단계: [대문자] 보고 [한글이름] 쓰기 (예: A -> 에이)",
            2: "2단계: [한글이름] 보고 [대문자] 쓰기 (예: 에이 -> A)",
            3: "3단계: [소문자] 보고 [한글이름] 쓰기 (예: a -> 에이)",
            4: "4단계: [한글이름] 보고 [소문자] 쓰기 (예: 에이 -> a)",
            5: "5단계: [전체 혼합] 집중하세요!"
        };
        guide.innerText = texts[level];
    }

    function spawnChar() {
        if (!gameActive) return;
        const data = charDb[Math.floor(Math.random() * charDb.length)];
        let display, answer, currentType = level;
        
        if(level === 5) currentType = Math.floor(Math.random() * 4) + 1;

        if(currentType === 1) { display = data.upper; answer = data.kor; }
        else if(currentType === 2) { display = data.kor; answer = data.upper; }
        else if(currentType === 3) { display = data.lower; answer = data.kor; }
        else if(currentType === 4) { display = data.kor; answer = data.lower; }

        fallingChars.push({
            display: display,
            answer: answer,
            x: Math.random() * (canvas.width - 250) + 125,
            y: 0,
            color: `hsl(${Math.random() * 360}, 65%, 45%)`
        });
    }

    input.addEventListener("keyup", (e) => {
        if (e.key === "Enter") {
            const val = input.value.trim();
            let foundIndex = -1;
            
            for (let i = 0; i < fallingChars.length; i++) {
                if (fallingChars[i].answer.toLowerCase() === val.toLowerCase()) {
                    foundIndex = i;
                    break;
                }
            }

            if (foundIndex !== -1) {
                fallingChars.splice(foundIndex, 1);
                score += (level * 10);
                if (score > 0 && score % 50 === 0 && level < 5) {
                    level++;
                    updateGuide();
                }
            }
            input.value = "";
        }
    });

    function update() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 하트 표시
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(40 + i * 45, 40, 15, 0, Math.PI * 2);
            ctx.fillStyle = i < lives ? "#db2777" : "#e5e7eb";
            ctx.fill();
        }

        // UI 정보
        ctx.fillStyle = "#333";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "right";
        ctx.fillText(`SCORE: ${score} | LEVEL: ${level}`, canvas.width - 30, 45);

        // 글자 하강
        ctx.textAlign = "center";
        ctx.font = "bold 55px Arial";
        for (let i = fallingChars.length - 1; i >= 0; i--) {
            let obj = fallingChars[i];
            obj.y += 0.7; // 7초 주기에 맞춘 느린 속도
            
            ctx.fillStyle = obj.color;
            ctx.fillText(obj.display, obj.x, obj.y);

            if (obj.y > canvas.height - 110) {
                fallingChars.splice(i, 1);
                lives--;
                if (lives <= 0) gameActive = false;
            }
        }

        if (gameActive) {
            requestAnimationFrame(update);
        } else {
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#db2777";
            ctx.font = "bold 65px Arial";
            ctx.fillText("학습 종료!", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = "#333";
            ctx.font = "bold 35px Arial";
            ctx.fillText(`최종 점수: ${score}점`, canvas.width / 2, canvas.height / 2 + 50);
            input.style.display = "none";
        }
    }

    updateGuide();
    setInterval(spawnChar, 7000); // 정확히 7초마다 생성
    update();
    input.focus();
    document.addEventListener('touchstart', () => input.focus());
</script>
</body>
</html>
