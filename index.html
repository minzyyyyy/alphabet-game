<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알파벳 스카이폴 - 하트 에디션</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; font-family: 'Malgun Gothic', sans-serif; touch-action: none; }
        canvas { display: block; background: #ffffff; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        #input-box { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        input { font-size: 40px; width: 100px; text-align: center; border: 3px solid #db2777; border-radius: 15px; outline: none; padding: 5px; color: #db2777; font-weight: bold; }
        label { margin-bottom: 10px; color: #db2777; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="input-box">
        <label>입력 후 엔터를 누르세요!</label>
        <input type="text" id="answerInput" maxlength="1" autofocus autocomplete="off">
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const input = document.getElementById("answerInput");

    // 화면 크기 설정 (태블릿 가로 모드 최적화)
    canvas.width = 800;
    canvas.height = 600;

    // 게임 변수
    let score = 0, lives = 5, level = 1, combo = 0;
    let fallingChars = [];
    let gameActive = true;

    // 하트 이미지 로드
    const heartImg = new Image();
    heartImg.src = 'heart.png'; // 업로드한 이미지 파일명

    const levelConfig = {
        1: { chars: "ABCDEFGHIJKLM", score: 10, speed: 1.5 },
        2: { chars: "NOPQRSTUVWXYZ", score: 30, speed: 2.0 },
        3: { chars: "abcdefghijklm", score: 50, speed: 2.5 },
        4: { chars: "nopqrstuvwxyz", score: 70, speed: 3.0 },
        5: { chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz", score: 100, speed: 3.5 }
    };

    function spawnChar() {
        if (!gameActive) return;
        const chars = levelConfig[level].chars;
        const char = chars.charAt(Math.floor(Math.random() * chars.length));
        fallingChars.push({
            char: char,
            x: Math.random() * (canvas.width - 100) + 50,
            y: 0,
            color: `hsl(${Math.random() * 360}, 60%, 40%)` // 글자마다 무작위 색상
        });
    }

    input.addEventListener("keyup", (e) => {
        if (e.key === "Enter") {
            const val = input.value;
            let found = false;
            // 가장 아래에 있는 글자부터 맞추기 위해 역순 검사
            for (let i = 0; i < fallingChars.length; i++) {
                if (fallingChars[i].char === val) {
                    fallingChars.splice(i, 1);
                    score += levelConfig[level].score;
                    combo++;
                    found = true;
                    if (combo >= 5 && level < 5) { level++; combo = 0; }
                    break;
                }
            }
            if (!found) combo = 0;
            input.value = "";
        }
    });

    function update() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 하트 아이콘 그리기 (왼쪽 상단)
        for (let i = 0; i < 5; i++) {
            if (i < lives) {
                // 남은 목숨은 올려주신 이미지로 표시
                ctx.drawImage(heartImg, 25 + i * 50, 20, 40, 40);
            } else {
                // 잃은 목숨은 반투명하게 표시
                ctx.globalAlpha = 0.2;
                ctx.drawImage(heartImg, 25 + i * 50, 20, 40, 40);
                ctx.globalAlpha = 1.0;
            }
        }

        // 2. 점수 및 레벨 (오른쪽 상단)
        ctx.fillStyle = "#333";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "right";
        ctx.fillText(`LV.${level} | SCORE: ${score}`, canvas.width - 25, 45);

        // 3. 떨어지는 글자
        ctx.textAlign = "center";
        ctx.font = "bold 45px Arial";
        for (let i = fallingChars.length - 1; i >= 0; i--) {
            let obj = fallingChars[i];
            obj.y += levelConfig[level].speed;
            
            ctx.fillStyle = obj.color;
            ctx.fillText(obj.char, obj.x, obj.y);

            // 바닥에 닿았을 때
            if (obj.y > canvas.height - 100) {
                fallingChars.splice(i, 1);
                lives--;
                combo = 0;
                if (lives <= 0) gameActive = false;
            }
        }

        if (gameActive) {
            requestAnimationFrame(update);
        } else {
            // 게임 오버 연출
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#db2777";
            ctx.font = "bold 70px Arial";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = "#333";
            ctx.font = "bold 40px Arial";
            ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
            input.style.display = "none";
            document.querySelector('label').innerText = "새로고침하여 다시 시작하세요";
        }
    }

    // 초기 실행
    setInterval(spawnChar, 7000);
    update();
    
    // 태블릿 터치 시 입력창 강제 포커스
    document.addEventListener('touchstart', () => input.focus());
    input.focus();
</script>
</body>
</html>
