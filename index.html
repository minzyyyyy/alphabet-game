<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알파벳 마스터 - 랭킹 시스템</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fdf2f8; font-family: 'Malgun Gothic', sans-serif; touch-action: none; }
        canvas { display: block; background: #ffffff; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        /* 시작 및 종료 화면 오버레이 */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); 
                    display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        #overlay h1 { color: #db2777; font-size: 40px; margin-bottom: 20px; }
        #overlay input { font-size: 24px; padding: 10px; border: 3px solid #db2777; border-radius: 10px; text-align: center; }
        #overlay button { margin-top: 20px; padding: 10px 30px; font-size: 20px; background: #db2777; color: white; border: none; border-radius: 10px; cursor: pointer; }

        /* 하단 입력/버튼 영역 */
        #ui-container { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; width: 100%; }
        #guide-text { margin-bottom: 10px; color: #db2777; font-weight: bold; font-size: 18px; background: white; padding: 5px 15px; border-radius: 20px; border: 2px solid #fbcfe8; }
        #input-area { display: none; }
        #choice-area { display: none; gap: 10px; }
        .choice-btn { padding: 10px 20px; font-size: 20px; background: white; border: 2px solid #db2777; border-radius: 10px; cursor: pointer; color: #db2777; font-weight: bold; }
        input[type="text"] { font-size: 30px; width: 200px; text-align: center; border: 3px solid #db2777; border-radius: 15px; padding: 10px; color: #db2777; font-weight: bold; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1 id="status-title">알파벳 마스터</h1>
        <div id="start-form">
            <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="8">
            <br>
            <button onclick="startGame()">게임 시작</button>
        </div>
        <div id="rank-display" style="margin-top: 20px; text-align: center; font-size: 18px;"></div>
    </div>

    <div id="ui-container">
        <div id="guide-text"></div>
        <div id="input-area">
            <input type="text" id="answerInput" placeholder="입력 후 엔터">
        </div>
        <div id="choice-area"></div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const nicknameInput = document.getElementById("nicknameInput");
    const answerInput = document.getElementById("answerInput");
    const overlay = document.getElementById("overlay");
    const choiceArea = document.getElementById("choice-area");
    const inputArea = document.getElementById("input-area");
    const guide = document.getElementById("guide-text");

    canvas.width = 800; canvas.height = 600;

    let score = 0, lives = 5, level = 1, gameActive = false, nickname = "";
    let fallingChars = [];
    const charDb = [
        {upper: "A", lower: "a", kor: "에이"}, {upper: "B", lower: "b", kor: "비"},
        {upper: "C", lower: "c", kor: "씨"}, {upper: "D", lower: "d", kor: "디"},
        {upper: "E", lower: "e", kor: "이"}, {upper: "F", lower: "f", kor: "에프"},
        {upper: "G", lower: "g", kor: "쥐"}, {upper: "H", lower: "h", kor: "에이치"},
        {upper: "I", lower: "i", kor: "아이"}, {upper: "J", lower: "j", kor: "제이"},
        {upper: "K", lower: "k", kor: "케이"}, {upper: "L", lower: "l", kor: "엘"},
        {upper: "M", lower: "m", kor: "엠"}, {upper: "N", lower: "n", kor: "엔"},
        {upper: "O", lower: "o", kor: "오"}, {upper: "P", lower: "p", kor: "피"},
        {upper: "Q", lower: "q", kor: "큐"}, {upper: "R", lower: "알"},
        {upper: "S", lower: "에스"}, {upper: "T", lower: "티"},
        {upper: "U", lower: "유"}, {upper: "V", lower: "브이"},
        {upper: "W", lower: "더블유"}, {upper: "X", lower: "엑스"},
        {upper: "Y", lower: "와이"}, {upper: "Z", lower: "지"}
    ];

    function startGame() {
        nickname = nicknameInput.value.trim() || "익명";
        overlay.style.display = "none";
        gameActive = true;
        score = 0; lives = 5; level = 1; fallingChars = [];
        update();
    }

    function spawnChar() {
        if (!gameActive) return;
        const data = charDb[Math.floor(Math.random() * charDb.length)];
        let type = level === 3 ? Math.floor(Math.random() * 4) + 1 : (level === 1 ? [1,2][Math.floor(Math.random()*2)] : [3,4][Math.floor(Math.random()*2)]);
        let display, answer, isChoice = Math.random() > 0.5;

        // 타입 설정: 1(대->한), 2(한->대), 3(소->한), 4(한->소)
        if(type === 1) { display = data.upper; answer = data.kor; }
        else if(type === 2) { display = data.kor; answer = data.upper; }
        else if(type === 3) { display = data.lower; answer = data.kor; }
        else if(type === 4) { display = data.kor; answer = data.lower; }

        fallingChars.push({ display, answer, isChoice, x: Math.random() * 600 + 100, y: 0 });
    }

    // 입력 및 선택 처리
    function checkAnswer(val) {
        let found = false;
        for (let i = 0; i < fallingChars.length; i++) {
            if (fallingChars[i].answer === val) {
                fallingChars.splice(i, 1);
                score += 10;
                if (score > 0 && score % 100 === 0 && level < 3) level++;
                found = true; break;
            }
        }
        answerInput.value = "";
        inputArea.style.display = "none";
        choiceArea.style.display = "none";
    }

    answerInput.addEventListener("keyup", (e) => { if(e.key === "Enter") checkAnswer(answerInput.value.trim()); });

    function showChoices(answer) {
        choiceArea.innerHTML = "";
        let choices = [answer];
        while(choices.length < 3) {
            let r = charDb[Math.floor(Math.random()*26)];
            let alt = [r.upper, r.lower, r.kor][Math.floor(Math.random()*3)];
            if(!choices.includes(alt)) choices.push(alt);
        }
        choices.sort(() => Math.random() - 0.5);
        choices.forEach(c => {
            let btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c;
            btn.onclick = () => checkAnswer(c);
            choiceArea.appendChild(btn);
        });
    }

    function update() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // UI 그리기
        ctx.fillStyle = "#db2777";
        for (let i = 0; i < lives; i++) ctx.beginPath(), ctx.arc(30+i*35, 30, 12, 0, Math.PI*2), ctx.fill();
        ctx.fillStyle = "#333"; ctx.font = "bold 20px Arial"; ctx.textAlign = "right";
        ctx.fillText(`${nickname} | LV.${level} | SCORE: ${score}`, 780, 40);

        let activeInput = false;
        for (let i = fallingChars.length - 1; i >= 0; i--) {
            let obj = fallingChars[i];
            obj.y += (0.5 + level * 0.2);
            ctx.fillStyle = "#333"; ctx.font = "bold 50px Arial"; ctx.textAlign = "center";
            ctx.fillText(obj.display, obj.x, obj.y);

            // 화면 하단 일정 거리에 오면 입력창/선택지 활성화
            if (obj.y > 350 && !activeInput) {
                activeInput = true;
                guide.innerText = obj.isChoice ? "알맞은 버튼을 누르세요!" : "정답을 정확히 입력하세요!";
                if(obj.isChoice) { choiceArea.style.display = "flex"; inputArea.style.display = "none"; if(choiceArea.innerHTML==="") showChoices(obj.answer); }
                else { inputArea.style.display = "block"; choiceArea.style.display = "none"; answerInput.focus(); }
            }

            if (obj.y > 520) { 
                fallingChars.splice(i, 1); lives--; 
                choiceArea.innerHTML = ""; inputArea.style.display = "none"; choiceArea.style.display = "none";
                if (lives <= 0) endGame(); 
            }
        }
        if (gameActive) requestAnimationFrame(update);
    }

    function endGame() {
        gameActive = false;
        overlay.style.display = "flex";
        document.getElementById("status-title").innerText = "게임 종료!";
        document.getElementById("start-form").innerHTML = `<button onclick="location.reload()">다시 하기</button>`;
        
        // 랭킹 저장 및 표시
        let ranks = JSON.parse(localStorage.getItem("alphabet_ranks") || "[]");
        ranks.push({name: nickname, score: score});
        ranks.sort((a,b) => b.score - a.score);
        ranks = ranks.slice(0, 5);
        localStorage.setItem("alphabet_ranks", JSON.stringify(ranks));

        let rankHtml = "<b>🏆 실시간 순위 (TOP 5)</b><br>";
        ranks.forEach((r, i) => { rankHtml += `${i+1}위: ${r.name} (${r.score}점)<br>`; });
        document.getElementById("rank-display").innerHTML = rankHtml;
    }

    setInterval(spawnChar, 7000);
</script>
</body>
</html>
