<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>알파벳 낚시 게임</title>
    <style>
        body { margin: 0; overflow: hidden; background: #e0f7fa; font-family: 'Arial', sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; cursor: crosshair; }
        .fish {
            position: absolute;
            font-size: 50px;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .fish-body { font-size: 60px; }
        .letter { position: absolute; top: 15px; color: white; text-shadow: 2px 2px 2px #000; }
        #score-board { position: fixed; top: 20px; left: 20px; font-size: 24px; background: white; padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #target { position: fixed; top: 20px; right: 20px; font-size: 30px; color: #00796b; background: #fff; padding: 10px 20px; border-radius: 20px; border: 4px solid #00796b; }
    </style>
</head>
<body>

<div id="score-board">점수: <span id="score">0</span></div>
<div id="target">찾을 글자: <span id="target-letter">A</span></div>
<div id="game-container"></div>

<script>
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let score = 0;
    let targetLetter = "";
    const container = document.getElementById('game-container');

    function createFish() {
        const fish = document.createElement('div');
        fish.className = 'fish';
        const letter = letters[Math.floor(Math.random() * letters.length)];
        
        fish.innerHTML = `
            <span class="fish-body">🐟</span>
            <span class="letter">${letter}</span>
        `;

        // 랜덤 위치 및 속도
        let x = Math.random() * (window.innerWidth - 100);
        let y = Math.random() * (window.innerHeight - 100);
        let dx = (Math.random() - 0.5) * 4;
        let dy = (Math.random() - 0.5) * 4;

        fish.style.left = x + 'px';
        fish.style.top = y + 'px';

        fish.addEventListener('mousedown', () => {
            if (letter === targetLetter) {
                score += 10;
                document.getElementById('score').innerText = score;
                fish.style.transform = "scale(1.5)";
                setTimeout(() => {
                    fish.remove();
                    setNewTarget();
                    createFish(); // 새 물고기 충원
                }, 200);
            } else {
                fish.style.transform = "translateX(10px)";
                setTimeout(() => fish.style.transform = "translateX(0)", 100);
            }
        });

        container.appendChild(fish);

        function move() {
            x += dx;
            y += dy;
            if (x < 0 || x > window.innerWidth - 80) dx *= -1;
            if (y < 50 || y > window.innerHeight - 80) dy *= -1;
            fish.style.left = x + 'px';
            fish.style.top = y + 'px';
            requestAnimationFrame(move);
        }
        move();
    }

    function setNewTarget() {
        targetLetter = letters[Math.floor(Math.random() * letters.length)];
        document.getElementById('target-letter').innerText = targetLetter;
    }

    // 초기 물고기 15마리 생성
    setNewTarget();
    for(let i=0; i<15; i++) {
        setTimeout(createFish, i * 100);
    }
</script>
</body>
</html>
